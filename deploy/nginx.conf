# Production reverse proxy. Mounted as an nginx template: ${DOMAIN} is substituted at
# container start; nginx runtime variables ($host, $uri, ...) are left untouched.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream slotease_backend {
    server backend:8000;
    keepalive 16;
}

upstream slotease_frontend {
    server frontend:80;
}

# ---------- HTTP: ACME challenge + redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${DOMAIN}$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;
    server_tokens off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSockets
    location /ws {
        # Query strings carry short-lived WS tickets; keep them out of access logs.
        access_log off;
        proxy_pass http://slotease_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # API, auth (incl. Google OAuth callback), health
    location /api {
        proxy_pass http://slotease_backend;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # SPA route that the Google sign-in callback redirects to (must not hit the API).
    location = /auth/callback {
        proxy_pass http://slotease_frontend;
    }

    location /auth {
        proxy_pass http://slotease_backend;
        proxy_set_header Connection "";
    }

    location = /health {
        proxy_pass http://slotease_backend;
        proxy_set_header Connection "";
        access_log off;
    }

    # Everything else: the SPA
    location / {
        proxy_pass http://slotease_frontend;
    }
}
