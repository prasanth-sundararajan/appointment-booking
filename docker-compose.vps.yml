# Shared Hostinger VPS: served by the existing Caddy at https://${DOMAIN}${ROOT_PATH}/
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_CONCURRENCY: "2"
      FORWARDED_ALLOW_IPS: "*"
      SCHEDULER_ENABLED: "false"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    entrypoint: ["python", "-m", "app.jobs.run_scheduler"]
    depends_on: [backend]
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://${DOMAIN}${ROOT_PATH}
        VITE_WS_URL: wss://${DOMAIN}${ROOT_PATH}
        VITE_BASE_PATH: ${ROOT_PATH}/
    restart: unless-stopped
    volumes: [./deploy/vps/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [backend]
    networks:
      default: {}
      proxy: {aliases: [slotease-web]}
volumes:
  pgdata:
networks:
  proxy:
    external: true
    name: reviewlens_default
