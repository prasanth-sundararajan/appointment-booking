<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
  body { margin: 0; padding: 24px; background: #f5f6f8; font-family: Arial, Helvetica, sans-serif; color: #1f2937; }
  .card { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  table.details { width: 100%; border-collapse: collapse; margin: 16px 0; }
  table.details td { padding: 6px 0; vertical-align: top; }
  table.details td.label { color: #6b7280; width: 40%; }
  .btn { display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; padding: 10px 18px; border-radius: 6px; }
  .note { color: #6b7280; font-size: 13px; margin-top: 24px; }
  .ok { color: #047857; }
  .warn { color: #b45309; }
</style>
</head>
<body>
<div class="card">
{% block content %}{% endblock %}
<p class="note">Sent by {{ app_name }}.</p>
</div>
</body>
</html>
